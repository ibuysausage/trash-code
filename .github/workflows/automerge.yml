name: automerge

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Update flake.lock"
    types:
      - completed

jobs:
  automerge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Find and merge automated PR
        env:
          GH_TOKEN: ${{ secrets.FLAKE_LOCK_PAT }}
        run: |
          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --label automated \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR" ]; then
            echo "No automated PR found"
            exit 0
          fi

          echo "Merging PR #$PR"

          gh pr merge "$PR" \
            --squash
